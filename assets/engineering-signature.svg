<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="244" viewBox="0 0 1100 244" role="img" aria-labelledby="title desc">
<title id="title">Engineering disciplines — Rust at the center</title>
<desc id="desc">An elegant cobalt-and-gold technical signature with Rust as the language of choice, surrounded by systems engineering, applied AI, product development, and security research.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102341"/><stop offset="1" stop-color="#1D3557"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A7844D"/><stop offset=".55" stop-color="#EFDAAA"/><stop offset="1" stop-color="#A7844D"/></linearGradient>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" stroke="#A8B5D0" stroke-opacity=".07" fill="none"/></pattern>
</defs>
<rect x="0" y="0" width="1100" height="244" rx="14" fill="url(#bg)"/>
<rect width="1100" height="244" rx="14" fill="url(#grid)"/>
<rect x="11" y="11" width="1078" height="222" rx="8" fill="none" stroke="#D8B77E" stroke-opacity=".54"/>
